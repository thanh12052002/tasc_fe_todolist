<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="todo-app">
      <!-- Tiêu đề -->
      <h2>Todo App</h2>

      <!-- Add new todo -->
      <div class="input-section">
        <input type="text" id="todo-input" placeholder="Add your new todo" />
        <button id="add-btn">+</button>
      </div>

      <!-- Todo list container -->
      <div class="todo-list" id="todo-list-id"></div>

      <!-- Footer -->
      <div class="footer">
        <span id="task-count">You have 0 pending tasks</span>
        <button id="clear-btn">Clear All</button>
      </div>
    </div>

    <!-- JS -->
    <script src="./fe.js"></script>
  </body>
</html>
